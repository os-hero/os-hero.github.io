<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2d6f90">
    <title>OS Hero</title>
    <meta
      name="description"
      content="OS Hero is a menu bar and system tray pixel companion for macOS and Windows."
    >
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css?v=0.1.18">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="OS Hero home">
        <img class="brand-mark" src="/assets/app-icon.png" alt="">
        <span class="brand-text" data-i18n="brand">OS Hero</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/install" data-i18n="nav.install">Install</a>
        <a href="/contact" data-i18n="nav.contact">Contact</a>
        <label class="language-control">
          <span class="sr-only" data-i18n="nav.language">Language</span>
          <select id="languageSelect" aria-label="Language">
            <option value="en" aria-label="English">🇺🇸</option>
            <option value="ko" aria-label="한국어">🇰🇷</option>
            <option value="zh" aria-label="简体中文">🇨🇳</option>
          </select>
        </label>
      </nav>
    </header>
    <main id="app" class="site-main" tabindex="-1"></main>
    <script src="/app.js?v=0.1.18"></script>
  </body>
</html>
